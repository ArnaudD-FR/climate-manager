[project]
name = "climate_manager"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.14.*"
prek = "*"

[tool.pixi.pypi-dependencies]
pytest-homeassistant-custom-component = "*"

[tool.pixi.tasks]
test = "python -m pytest tests/"
use-case-data = "python -m pytest docs/use-cases/generate.py -q"
lint = "prek run --all-files"
