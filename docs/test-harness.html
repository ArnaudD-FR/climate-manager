<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climate Manager – Test Harness</title>
  <link rel="stylesheet" href="/docs/ha-theme.css">
</head>
<body>
<div id="mount"></div>

<!-- Stubs of the HA elements (ha-icon, ha-selector, ha-button, tabs…) -->
<script src="/docs/ha-stubs.js"></script>

<!-- panel.js is a module; it runs before the sibling inline module below -->
<script type="module" src="/custom_components/climate_manager/www/panel.js"></script>

<!-- Mock hass — runs after panel.js defines climate-manager-panel -->
<script type="module">
  import { mountPanel } from '/docs/harness.js';

  const ZONE_ID = 'zone-upstairs-abc123';

  const weekdayProg = [
    { start: '00:00', mode: 'frost_protection' },
    { start: '06:30', mode: 'normal' },
    { start: '09:00', mode: 'reduced' },
    { start: '17:00', mode: 'normal' },
    { start: '22:00', mode: 'frost_protection' },
  ];
  const weekendProg = [
    { start: '00:00', mode: 'frost_protection' },
    { start: '08:00', mode: 'normal' },
    { start: '10:00', mode: 'comfort' },
    { start: '14:00', mode: 'reduced' },
    { start: '17:00', mode: 'normal' },
    { start: '23:00', mode: 'frost_protection' },
  ];
  const livingRoomWeekdayProg = [
    { start: '00:00', mode: 'frost_protection' },
    { start: '07:00', mode: 'normal' },
    { start: '09:30', mode: 'reduced' },
    { start: '18:00', mode: 'comfort' },
    { start: '23:00', mode: 'frost_protection' },
  ];
  const livingRoomWeekendProg = [
    { start: '00:00', mode: 'frost_protection' },
    { start: '09:00', mode: 'comfort' },
    { start: '23:00', mode: 'frost_protection' },
  ];

  function mkProg(wd, we) {
    return { mon: wd, tue: wd, wed: wd, thu: wd, fri: wd, sat: we, sun: we };
  }

  const defaultProg  = mkProg(weekdayProg, weekendProg);
  const livingRoomProg = mkProg(livingRoomWeekdayProg, livingRoomWeekendProg);

  const aliceWD = [
    { start: '00:00', state: 'absent' }, { start: '07:00', state: 'present' },
    { start: '09:00', state: 'absent' }, { start: '17:30', state: 'present' },
    { start: '23:00', state: 'absent' },
  ];
  const aliceWE = [
    { start: '00:00', state: 'absent' }, { start: '08:30', state: 'present' },
    { start: '23:30', state: 'absent' },
  ];

  const CONFIG = {
    period_temperatures: { frost_protection: 7, reduced: 16, normal: 20, comfort: 22 },
    // Phase 14 (D-11): Default Zone is an object (name/mode/time_program),
    // replacing the old flat global_mode/global_time_program/default_zone_name.
    default_zone: { name: 'Home', mode: 'time_program', time_program: defaultProg },
    zones: {
      [ZONE_ID]: { name: 'Upstairs', mode: 'time_program_presences', time_program: defaultProg },
    },
    // Phase 15 (D-07): rooms have no room_mode — they follow their zone.
    rooms: {
      bedroom:     { zone_id: ZONE_ID },
      kitchen:     {},
      living_room: {},
    },
    persons: {
      'person.alice': { mode: 'scheduled', room_ids: ['bedroom'],               schedule: mkProg(aliceWD, aliceWE) },
      'person.bob':   { mode: 'ha',        room_ids: ['living_room', 'kitchen'] },
    },
    climate_entities: ['climate.bedroom_trv', 'climate.kitchen_trv', 'climate.living_room_trv'],
  };

  const STATUS = {
    // Per-zone status incl. the HA entity_ids resolved by the backend.
    zones: {
      default:   { mode: 'time_program',           active_period: 'normal', mode_entity_id: 'select.home_mode',     period_entity_id: 'sensor.home_period' },
      [ZONE_ID]: { mode: 'time_program_presences', active_period: 'normal', mode_entity_id: 'select.upstairs_mode', period_entity_id: 'sensor.upstairs_period' },
    },
    present_persons: ['person.alice'],
    rooms_status: [
      { area_id: 'bedroom',     name: 'Bedroom',     entity_ids: ['climate.bedroom_trv'],     temperature: 19.5, humidity: 52, active_period: 'normal',  present_person_count: 1, has_trv: true, period_entity_id: 'sensor.bedroom_period', temperature_entity_id: 'sensor.bedroom_temperature', humidity_entity_id: 'sensor.bedroom_humidity' },
      { area_id: 'kitchen',     name: 'Kitchen',     entity_ids: ['climate.kitchen_trv'],     temperature: 21.0, humidity: 45, active_period: 'normal',  present_person_count: 0, has_trv: true, period_entity_id: 'sensor.kitchen_period' },
      { area_id: 'living_room', name: 'Living Room', entity_ids: ['climate.living_room_trv'], temperature: 20.2, humidity: 48, active_period: 'comfort', present_person_count: 1, has_trv: true, period_entity_id: 'sensor.living_room_period', temperature_entity_id: 'sensor.living_room_temperature' },
    ],
  };

  const mockHass = {
    connection: {
      sendMessagePromise(msg) {
        if (msg.type === 'climate_manager/get_config') return Promise.resolve(JSON.parse(JSON.stringify(CONFIG)));
        if (msg.type === 'climate_manager/get_status')  return Promise.resolve(JSON.parse(JSON.stringify(STATUS)));
        return Promise.resolve({ success: true });
      },
      subscribeMessage(callback) {
        // Push status on next tick so the component is fully connected
        setTimeout(() => callback(JSON.parse(JSON.stringify(STATUS))), 100);
        return Promise.resolve(() => {});
      },
    },
    states: {
      'climate.bedroom_trv':    { state: 'heat',     attributes: { friendly_name: 'Bedroom TRV',     current_temperature: 19.5, temperature: 20 } },
      'climate.kitchen_trv':    { state: 'heat',     attributes: { friendly_name: 'Kitchen TRV',     current_temperature: 21.0, temperature: 20 } },
      'climate.living_room_trv':{ state: 'heat',     attributes: { friendly_name: 'Living Room TRV', current_temperature: 20.2, temperature: 22 } },
      'person.alice':           { state: 'home',     attributes: { friendly_name: 'Alice' } },
      'person.bob':             { state: 'not_home', attributes: { friendly_name: 'Bob'   } },
    },
    areas: {
      bedroom:     { area_id: 'bedroom',     name: 'Bedroom',     floor_id: 'first_floor'  },
      kitchen:     { area_id: 'kitchen',     name: 'Kitchen',     floor_id: 'ground_floor' },
      living_room: { area_id: 'living_room', name: 'Living Room', floor_id: 'ground_floor' },
    },
    floors: {
      ground_floor: { floor_id: 'ground_floor', name: 'Ground Floor', level: 0 },
      first_floor:  { floor_id: 'first_floor',  name: 'First Floor',  level: 1 },
    },
    callService() { return Promise.resolve(); },
  };

  mountPanel(mockHass);
  console.log('[harness] panel appended with hass');
</script>
</body>
</html>
