<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climate Manager – Use-case Harness</title>
  <link rel="stylesheet" href="/docs/ha-theme.css">
</head>
<body>
<div id="mount"></div>

<!-- Stubs of the HA elements (ha-icon, ha-selector, ha-button, tabs…) -->
<script src="/docs/ha-stubs.js"></script>

<!-- panel.js is a module; it runs before the sibling inline module below -->
<script type="module" src="/custom_components/climate_manager/www/panel.js"></script>

<!-- Generic harness: render the panel from a generated scenario.json.
     The scenario URL is passed as ?scenario=<path>. config + status come
     straight from the coordinator output (no hand-written values). -->
<script type="module">
  import { mountPanel } from '/docs/harness.js';

  const params = new URLSearchParams(location.search);
  const scenarioUrl = params.get('scenario');
  if (!scenarioUrl) {
    console.error('[harness] missing ?scenario= query parameter');
  }
  const scenario = await (await fetch(scenarioUrl)).json();
  const CONFIG = scenario.config;
  const STATUS = scenario.status;
  const world = scenario.hass || {};

  const mockHass = {
    connection: {
      sendMessagePromise(msg) {
        if (msg.type === 'climate_manager/get_config')
          return Promise.resolve(JSON.parse(JSON.stringify(CONFIG)));
        if (msg.type === 'climate_manager/get_status')
          return Promise.resolve(JSON.parse(JSON.stringify(STATUS)));
        return Promise.resolve({ success: true });
      },
      subscribeMessage(callback) {
        setTimeout(() => callback(JSON.parse(JSON.stringify(STATUS))), 100);
        return Promise.resolve(() => {});
      },
    },
    states: world.states || {},
    areas: world.areas || {},
    floors: world.floors || {},
    callService() { return Promise.resolve(); },
  };

  mountPanel(mockHass);
  console.log('[harness] panel appended with hass from', scenarioUrl);
</script>
</body>
</html>
